services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-studyroom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studyroom}
      POSTGRES_DB: ${DB_NAME:-studyroom}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 数据库不发布到宿主端口，仅在 compose 内部网络提供服务
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-studyroom} -d ${DB_NAME:-studyroom}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-studyroom}
      DB_PASSWORD: ${DB_PASSWORD:-studyroom}
      DB_NAME: ${DB_NAME:-studyroom}
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      TZ: Asia/Shanghai
    # 应用接口不直接发布宿主，统一经 web(nginx) 反代 /api

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 仅将应用 Web 端口发布到宿主；宿主端口由 CC_PUBLISH_PORT 指定
      - "${CC_PUBLISH_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
